<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>TikTok Downloader</h1>
  <p>Paste any TikTok link and download instantly</p>

  <input type="text" id="url" placeholder="Paste TikTok URL">
  <button onclick="download()">Download</button>

  <p id="result"></p>
</div>

<script>
async function download() {
  const url = document.getElementById("url").value.trim();
  const result = document.getElementById("result");

  if (!url) {
    result.innerText = "Paste a link first!";
    return;
  }

  result.innerText = "Loading...";

  try {
    const response = await fetch(`/download?url=${encodeURIComponent(url)}`);
    const data = await response.json();

    if (data.video) {
      result.innerHTML = `<a href="${data.video}" target="_blank" class="download-btn">Download Video</a>`;
    } else {
      result.innerText = data.error || "Failed. Try another link.";
    }
  } catch (err) {
    result.innerText = "Server error.";
  }
}
</script>

</body>
</html>
